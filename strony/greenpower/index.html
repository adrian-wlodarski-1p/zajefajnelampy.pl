<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8">
        <title>Układ strony</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body><div id="page">
        <header>
            <img src="img/r1-l.png" alt="" />
            <img src="img/r1-m.png" alt="Green Power Technology" />
            <img src="img/r1-r.png" alt="" />
        </header>
        <nav>
            <a href="#">Home</a>
            <a href="#">Projekty</a>
            <a href="#">Galeria</a>
            <a href="#">O Nas</a>
        </nav>
        <main>
            <aside>
                <h2>Ostatnio dołączyli:</h2>
                <figure>
                    <img src="img/u1.png" alt="" />
                    <figcaption>Ariel</figcaption>
                    <figcaption>Flora designer</figcaption>
                </figure>
                <figure>
                    <img src="img/u2.png" alt="" />
                    <figcaption>Reo</figcaption>
                    <figcaption>Ground designer</figcaption>
                </figure>
                <figure>
                    <img src="img/u3.png" alt="" />
                    <figcaption>Trida</figcaption>
                    <figcaption>Autumn designer</figcaption>
                </figure>
                <figure>
                    <img src="img/u4.png" alt="" />
                    <figcaption>Riana</figcaption>
                    <figcaption>Butterfly designer</figcaption>
                </figure>
            </aside>
            <div class="mainforms">
                <h2>Formularz zgłoszeniowy:</h2>
                <form>
                    <fieldset class="formgrid">
                        <legend id="legend1">Green PowerCreate account</legend>
                        <fieldset id="fieldset2">
                            <legend>Dane osobowe</legend>
                            <label for="email">Email:</label>
                            <input id="email" name="email" type="email" class="wbig">
                            <label for="nazwisko">Nazwisko:</label>
                            <input id="nazwisko" name="nazwisko" type="text" class="wbig">
                            <label for="imie">Imię:</label>
                            <input id="imie" name="imie" type="text" class="wbig">
                            <label for="adres">Adres:</label>
                            <input id="adres" name="adres" type="text" class="wbig">
                            <label for="miasto">Miasto:</label>
                            <input id="miasto" name="miasto" type="text" class="wbig">
                            <label for="kodpoczt">Kod pocztowy:</label>
                            <input id="kodpoczt" name="kodpoczt" type="text" class="wsmall">
                            <label for="tel">Telefon kontaktowy:</label>
                            <input id="tel" name="tel" type="tel" class="wsmall">

                            <h3>Weryfikacja danych na podstawie karty kredytowej</h3>
                            <div class="formgrid">
                                <div>
                                    <label for="card">Rodzaj karty:</label>
                                    <input id="card" name="card" type="text" class="wmax">
                                    <label for="cvc">Kod CVC:</label>
                                    <input id="cvc" name="cvc" type="text" class="wmax">
                                    <label for="data">Data ważności:</label>
                                    <input id="data" name="data" type="date" class="wmax">
                                </div>
                                <div id="icondiv"><img src="img/gv.png" alt="green energy icon"></div>
                            </div>
                        </fieldset>
                        <fieldset>
                            <legend>Stanowisko</legend>
                            <label for="role">Wybierz z listy wolne stanowisko:</label>
                            <select id="role" name="role" class="wsmall">
                                <optgroup label="Designers">
                                    <option value="flora-designer">Flora designer</option>
                                    <option value="fauna-designer">Fauna designer</option>
                                    <option value="autumn-designer">Autumn designer</option>
                                    <option value="doom-designer">Doom designer</option>
                                </optgroup>
                                <optgroup label="Terraformers">
                                    <option value="m-class">M class planet terraformer</option>
                                    <option value="y-class">Y class planet terraformer</option>
                                </optgroup>
                                <optgroup label="Managers">
                                    <option value="pop-manager">Population manager</option>
                                    <option value="dream-manager">Dream manager</option>
                                </optgroup>
                            </select>
                            <hr>
                            <label for="okres">Okres zatrudnienia</label>
							<div id="okres" class="formgrid">
								<label><input name="okres" type="radio" value="1y">1 rok</label>
								<label><input name="okres" type="radio" value="10y">10 lat</label>
								<label><input name="okres" type="radio" value="100y">100 lat</label>
								<label><input name="okres" type="radio" value="forever">1 for ever</label>
							</div>
							<fieldset id="innewar">
							    <legend>Określ inne warunki pracy</legend>
								<label for="wynagrodzenie">Wynagrodzenie:</label>
								<div id="wynagrodzenie" class="formgrid">
									<label>Min: <input name="wynagrodzenie-min" type="range" min="0" max="5" value="1"></label>
									<label>Max: <input name="wynagrodzenie-max" type="range" min="0" max="5" value="1"></label>
								</div>
								<div id="legendx" class="formgrid">
								    <div>0 / 255</div>
									<div>1 rok</div>
								</div>
							</fieldset>
                        </fieldset>
                    </fieldset>
                </form>
            </div>
        </main>
        <footer>
            <img src="img/f1-l.png" alt="tech" />
            <div>
                <p>Dane kontaktowe:</p>
                <p>Ul. Ekologiczna 30</p>
                <p>31-055 Kraków</p>
                <p>tel: 00-222-333</p>
            </div>
        </footer>
    </div></body>
</html>
