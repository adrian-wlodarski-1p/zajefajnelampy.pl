<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Tabela</title>
        <link rel="stylesheet" href="styles.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div id="wrapper">
            <table id="orders">
                <tr>
                    <th>Date</th>
                    <th>Order ID</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                </tr>
            </table>
			<div>
				<button onclick="addRow();">Add order</button>
				<button onclick="removeRow();">Remove order</button>
				<button onclick="cancelAll();">Cancel all</button>
				<button onclick="checkout();">Checkout</button>
				<table id="sum"> <tr> <td></td> </tr> </table>
			</div>
        </div>
    </body>
</html>
